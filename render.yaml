services:
  - type: web
    name: campus-energy-api
    runtime: docker
    repo: https://github.com/Andrew-Velox/bup_hackathon_pre.git
    branch: main
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # You'll set this manually in the Render dashboard
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GROQ_API_KEY
        sync: false  # You'll set this manually in the Render dashboard
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: PORT
        value: "8000"
      - key: HOST
        value: 0.0.0.0
